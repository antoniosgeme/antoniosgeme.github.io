<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shock Angles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;1,400&display=swap">

<style>
  :root {
    --ground:#f2f4f7; --panel:#ffffff; --panel-sunk:#eef1f5;
    --ink:#0e1319; --ink-soft:#4a5763; --ink-faint:#8794a1;
    --rule:#d7dee6; --rule-soft:#e6ebf0;
    --accent:#1f7a8c; --accent-soft:#e2eff2; --track:#d2dae2;
    --up:#dfe8ef; --down:#f6d9c2; --wedge:#2b3742; --shock:#b5384a; --on-wedge:#e8eef4;
    --grid:#e6ebf0; --curve:#1f7a8c; --curve-2:#8794a1;
    --sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
    --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:#0b1016; --panel:#141b23; --panel-sunk:#101820;
      --ink:#e8eef4; --ink-soft:#9dabb8; --ink-faint:#64727f;
      --rule:#26313b; --rule-soft:#1c252e;
      --accent:#4bb3c7; --accent-soft:#14313a; --track:#2a3540;
      --up:#1b2831; --down:#3d2b22; --wedge:#8fa1af; --shock:#e0687b; --on-wedge:#0b1016;
      --grid:#1e2831; --curve:#4bb3c7; --curve-2:#64727f;
    }
  }
  :root[data-theme="dark"] {
    --ground:#0b1016; --panel:#141b23; --panel-sunk:#101820;
    --ink:#e8eef4; --ink-soft:#9dabb8; --ink-faint:#64727f;
    --rule:#26313b; --rule-soft:#1c252e;
    --accent:#4bb3c7; --accent-soft:#14313a; --track:#2a3540;
    --up:#1b2831; --down:#3d2b22; --wedge:#8fa1af; --shock:#e0687b; --on-wedge:#0b1016;
    --grid:#1e2831; --curve:#4bb3c7; --curve-2:#64727f;
  }

  * { box-sizing:border-box; }
  body { margin:0; background:var(--ground); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:1180px; margin:0 auto; padding:14px 14px 20px; display:flex; flex-direction:column; gap:24px; }
  header { display:flex; flex-direction:column; gap:6px; }
  h1 { margin:0; font-size:25px; font-weight:600; letter-spacing:-0.015em; text-wrap:balance; }
  .sub { margin:0; color:var(--ink-soft); max-width:68ch; }

  .stage { display:grid; grid-template-columns:minmax(0,1fr) 240px; gap:20px; align-items:start; }
  @media (max-width: 600px) {
    .stage { grid-template-columns: minmax(0, 1fr); }
  }
  .left { display:flex; flex-direction:column; gap:20px; min-width:0; }

  .field { background:var(--panel); border:1px solid var(--rule); overflow:hidden; }
  .field canvas { display:block; width:100%; }
  .cap { padding:9px 12px; border-top:1px solid var(--rule-soft); font-family:var(--mono); font-size:11px; color:var(--ink-soft); font-variant-numeric:tabular-nums; }

  .rail { display:flex; flex-direction:column; background:var(--panel); border:1px solid var(--rule); }
  .group { padding:14px 14px 16px; border-bottom:1px solid var(--rule-soft); }
  .group:last-child { border-bottom:0; }
  .glabel { font-size:10px; font-weight:600; letter-spacing:0.11em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:11px; }

  .seg { display:grid; grid-template-columns:1fr 1fr; border:1px solid var(--rule); }
  .seg button { border:0; border-right:1px solid var(--rule); background:var(--panel-sunk); text-align:center; }
  .seg button:last-child { border-right:0; }
  .seg button[aria-pressed="true"] { background:var(--accent); color:#fff; }

  .param { display:flex; flex-direction:column; gap:5px; margin-bottom:13px; }
  .param:last-child { margin-bottom:0; }
  .param.off { opacity:0.38; pointer-events:none; }
  .prow { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .pname { font-size:13px; color:var(--ink-soft); }
  .pname em { font-family:var(--serif); font-style:italic; color:var(--ink); }
  .pval { font-family:var(--mono); font-size:12.5px; font-variant-numeric:tabular-nums; color:var(--ink); }

  input[type="range"] { -webkit-appearance:none; appearance:none; width:100%; height:3px; background:var(--track); outline:none; margin:6px 0 0; cursor:pointer; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; width:14px; height:14px; border-radius:50%; background:var(--accent); border:2px solid var(--panel); box-shadow:0 0 0 1px var(--accent); cursor:pointer; }
  input[type="range"]::-moz-range-thumb { width:12px; height:12px; border-radius:50%; background:var(--accent); border:2px solid var(--panel); box-shadow:0 0 0 1px var(--accent); cursor:pointer; }
  input[type="range"]:focus-visible, button:focus-visible, input[type="checkbox"]:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  .checks { display:flex; flex-direction:column; gap:9px; }
  label.check { display:flex; align-items:center; gap:9px; cursor:pointer; font-size:13.5px; }
  label.check input { accent-color:var(--accent); width:15px; height:15px; margin:0; cursor:pointer; }
  label.check.off { opacity:0.38; pointer-events:none; }

  button { font-family:var(--sans); font-size:13px; padding:8px 11px; background:var(--panel-sunk); color:var(--ink); border:1px solid var(--rule); cursor:pointer; text-align:left; transition:background 120ms ease, border-color 120ms ease; }
  button:hover { background:var(--accent-soft); border-color:var(--accent); }
  .seg button:hover { border-color:var(--rule); }

  .readout { display:grid; grid-template-columns:auto 1fr; gap:5px 12px; font-family:var(--mono); font-size:12px; font-variant-numeric:tabular-nums; }
  .readout dt { color:var(--ink-faint); }
  .readout dd { margin:0; text-align:right; }

  .eq { background:var(--panel); border:1px solid var(--rule); padding:16px 18px; display:flex; flex-direction:column; gap:9px; }
  .eqline { font-family:var(--serif); font-size:17px; overflow-x:auto; white-space:nowrap; padding-bottom:2px; }
  .eqline i { font-style:italic; }
  sub, sup { font-size:0.68em; }
  .eqnote { font-size:13px; color:var(--ink-soft); max-width:78ch; }
  .eqnote code { font-family:var(--mono); font-size:0.9em; color:var(--ink); }
  .eqnote strong { font-weight:600; color:var(--ink); }

  .warn { margin:0; padding:9px 12px; background:var(--accent-soft); border:1px solid var(--accent); font-size:12.5px; }
  .warn[hidden] { display:none; }
  footer { font-size:12.5px; color:var(--ink-faint); border-top:1px solid var(--rule-soft); padding-top:14px; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<div class="wrap">

  <div class="stage">
    <div class="left">
      <div class="field">
        <canvas id="scene" width="900" height="560"></canvas>
        <div class="cap" id="cap">&nbsp;</div>
      </div>
      <div class="field" id="chartBox">
        <canvas id="chart" width="900" height="330"></canvas>
        <div class="cap">&#952;&ndash;&#946;&ndash;M diagram &mdash; deflection angle against shock angle for the current Mach number</div>
      </div>
    </div>

    <div class="rail">
      <div class="group">
        <div class="glabel">View</div>
        <div class="seg">
          <button id="mSrc" aria-pressed="true">Moving source</button>
          <button id="mWed" aria-pressed="false">Wedge</button>
        </div>
      </div>

      <div class="group">
        <div class="glabel">Parameters</div>
        <div class="param">
          <div class="prow"><span class="pname">Mach number <em>M</em></span><span class="pval" id="vM">2.00</span></div>
          <input type="range" id="sM" min="0.2" max="5" step="0.01" value="2">
        </div>
        <div class="param" id="pT">
          <div class="prow"><span class="pname">Wedge half-angle <em>&#952;</em></span><span class="pval" id="vT">10.0&#176;</span></div>
          <input type="range" id="sT" min="0" max="45" step="0.1" value="10">
        </div>
      </div>

      <div class="group" id="gSol">
        <div class="glabel">Solution</div>
        <div class="checks">
          <label class="check"><input type="checkbox" id="cStrong"> Strong branch</label>
        </div>
      </div>

      <div class="group">
        <div class="glabel">Derived</div>
        <dl class="readout" id="ro"></dl>
      </div>
    </div>
  </div>

  <p class="warn" id="warn" hidden></p>

  <div class="eq">
    <div class="eqline" id="eqA">
      sin <i>&#956;</i> = 1 / <i>M</i>
    </div>
    <div class="eqline" id="eqB" hidden>
      tan <i>&#952;</i> = 2 cot <i>&#946;</i> &#183; ( <i>M</i><sub>1</sub><sup>2</sup> sin<sup>2</sup><i>&#946;</i> &#8722; 1 ) / ( <i>M</i><sub>1</sub><sup>2</sup>(<i>&#947;</i> + cos 2<i>&#946;</i>) + 2 )
    </div>
    <p class="eqnote" id="note"></p>
  </div>
</div>

<script>
(function () {
  "use strict";
  var GAM = 1.4, RAD = Math.PI / 180, DEG = 180 / Math.PI;

  var scene = document.getElementById("scene"), sctx = scene.getContext("2d");
  var chart = document.getElementById("chart"), cctx = chart.getContext("2d");
  var wedgeMode = false;

  var el = {
    M: document.getElementById("sM"),
    T: document.getElementById("sT"),
    strong: document.getElementById("cStrong")
  };

  function cv(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

  // theta as a function of beta, for given M. Both in radians.
  function thetaOf(beta, M) {
    var s = Math.sin(beta), num = M * M * s * s - 1;
    if (num <= 0) return 0;
    return Math.atan(2 / Math.tan(beta) * num / (M * M * (GAM + Math.cos(2 * beta)) + 2));
  }

  // Largest deflection this Mach number can turn through, and where it occurs.
  // theta(beta) is unimodal on [mu, pi/2], so a ternary search converges cleanly.
  function detach(M) {
    var mu = Math.asin(Math.min(1 / M, 1));
    var lo = mu, hi = Math.PI / 2;
    for (var i = 0; i < 120; i++) {
      var m1 = lo + (hi - lo) / 3, m2 = hi - (hi - lo) / 3;
      if (thetaOf(m1, M) < thetaOf(m2, M)) lo = m1; else hi = m2;
    }
    var b = 0.5 * (lo + hi);
    return { betaMax: b, thetaMax: thetaOf(b, M) };
  }

  // Shock angle for a given deflection: bisect on the branch requested.
  function solveBeta(theta, M, strong) {
    var d = detach(M);
    if (theta > d.thetaMax) return null;
    var mu = Math.asin(Math.min(1 / M, 1));
    var lo = strong ? d.betaMax : mu, hi = strong ? Math.PI / 2 : d.betaMax;
    for (var i = 0; i < 80; i++) {
      var m = 0.5 * (lo + hi), t = thetaOf(m, M);
      if (strong ? (t > theta) : (t < theta)) lo = m; else hi = m;
    }
    return 0.5 * (lo + hi);
  }

  function shockProps(M1, beta, theta) {
    var Mn1 = M1 * Math.sin(beta);
    var p = 1 + 2 * GAM / (GAM + 1) * (Mn1 * Mn1 - 1);
    var rho = (GAM + 1) * Mn1 * Mn1 / (2 + (GAM - 1) * Mn1 * Mn1);
    var T = p / rho;
    var Mn2 = Math.sqrt((1 + (GAM - 1) / 2 * Mn1 * Mn1) / (GAM * Mn1 * Mn1 - (GAM - 1) / 2));
    var M2 = Mn2 / Math.sin(beta - theta);
    var p0 = Math.pow(p, -1 / (GAM - 1)) * Math.pow(rho, GAM / (GAM - 1));
    return { Mn1: Mn1, Mn2: Mn2, M2: M2, p: p, rho: rho, T: T, p0: p0 };
  }

  function line(c, x1, y1, x2, y2, col, w, dash) {
    c.strokeStyle = col; c.lineWidth = w; c.setLineDash(dash || []);
    c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); c.setLineDash([]);
  }

  function label(c, txt, x, y, col, size, align) {
    c.fillStyle = col;
    c.font = "500 " + size + "px " + "IBM Plex Mono, monospace";
    c.textAlign = align || "left"; c.textBaseline = "middle";
    c.fillText(txt, x, y);
  }

  /* ---------------- moving source ---------------- */
  function drawSource(M) {
    var W = scene.width, H = scene.height, dpr = W / scene.clientWidth;
    sctx.clearRect(0, 0, W, H);
    sctx.fillStyle = cv("--panel"); sctx.fillRect(0, 0, W, H);

    var cx = W * 0.72, cy = H * 0.5;
    var unit = W * 0.085;                       // pixels per (a * dt)
    var N = 7;

    sctx.strokeStyle = cv("--rule");
    sctx.lineWidth = Math.max(1, dpr);
    for (var n = 1; n <= N; n++) {
      sctx.beginPath();
      sctx.arc(cx - M * n * unit, cy, n * unit, 0, Math.PI * 2);
      sctx.stroke();
    }

    if (M > 1) {
      var mu = Math.asin(1 / M);
      var L = W;
      sctx.strokeStyle = cv("--shock");
      sctx.lineWidth = Math.max(2, dpr * 1.6);
      [-1, 1].forEach(function (sg) {
        sctx.beginPath();
        sctx.moveTo(cx, cy);
        sctx.lineTo(cx - L * Math.cos(mu), cy + sg * L * Math.sin(mu));
        sctx.stroke();
      });
      // angle arc
      sctx.strokeStyle = cv("--accent");
      sctx.lineWidth = Math.max(1.4, dpr);
      sctx.beginPath();
      sctx.arc(cx, cy, unit * 1.5, Math.PI - mu, Math.PI);
      sctx.stroke();
      label(sctx, "\u03bc = " + (mu * DEG).toFixed(1) + "\u00b0",
            cx - unit * 1.9, cy - unit * 0.55, cv("--accent"), 13 * dpr, "right");
    }

    // travel line and source
    line(sctx, cx - M * N * unit - unit, cy, W, cy, cv("--rule-soft"), Math.max(1, dpr), [6 * dpr, 5 * dpr]);
    sctx.fillStyle = cv("--wedge");
    sctx.beginPath(); sctx.arc(cx, cy, Math.max(4, dpr * 4), 0, Math.PI * 2); sctx.fill();
    label(sctx, "source", cx + unit * 0.25, cy - unit * 0.42, cv("--ink-soft"), 12 * dpr, "left");
  }

  /* ---------------- wedge ---------------- */
  // Where a ray from the apex leaves the canvas: right edge or top edge, whichever comes first.
  function exitPt(ax, ay, ang, W) {
    var tx = (W - ax) / Math.cos(ang);
    var ty = ang > 1e-6 ? ay / Math.sin(ang) : Infinity;
    var t = Math.min(tx, ty);
    return { x: ax + t * Math.cos(ang), y: ay - t * Math.sin(ang), top: ty < tx };
  }

  function drawWedge(M, theta, beta, det) {
    var W = scene.width, H = scene.height, dpr = W / scene.clientWidth;
    var detachedLabel = false;
    sctx.clearRect(0, 0, W, H);
    sctx.fillStyle = cv("--up"); sctx.fillRect(0, 0, W, H);

    var ax = W * 0.24, ay = H * 0.70;
    var eT = exitPt(ax, ay, theta, W);

    // 1. shocked region and the shock itself
    if (beta !== null) {
      var eB = exitPt(ax, ay, beta, W);
      sctx.fillStyle = cv("--down");
      sctx.beginPath();
      sctx.moveTo(ax, ay);
      sctx.lineTo(eB.x, eB.y);
      if (eB.top && !eT.top) sctx.lineTo(W, 0);
      sctx.lineTo(eT.x, eT.y);
      sctx.closePath();
      sctx.fill();
      line(sctx, ax, ay, eB.x, eB.y, cv("--shock"), Math.max(2.4, dpr * 1.8));
    } else {
      // The shock stands off ahead of the body: its nose faces the oncoming flow and the
      // wings sweep downstream, so x grows with distance from the axis.
      var off = W * 0.075;
      sctx.strokeStyle = cv("--shock"); sctx.lineWidth = Math.max(2.4, dpr * 1.8);
      sctx.beginPath();
      for (var i = 0; i <= 120; i++) {
        var sg = -1 + 2 * i / 120;
        var xx = ax - off + Math.pow(Math.abs(sg), 1.75) * W * 0.30;
        if (i === 0) sctx.moveTo(xx, ay + sg * H * 0.66); else sctx.lineTo(xx, ay + sg * H * 0.66);
      }
      sctx.stroke();
      detachedLabel = true;
    }

    // 2. the wedge, clipped to the canvas, painted over the shocked region
    sctx.fillStyle = cv("--wedge");
    sctx.beginPath();
    sctx.moveTo(ax, ay);
    sctx.lineTo(eT.x, eT.y);
    if (eT.top) sctx.lineTo(W, 0);
    sctx.lineTo(W, H);
    sctx.lineTo(ax, H);
    sctx.closePath(); sctx.fill();

    // 3. angle arcs and labels sit on top of everything
    if (beta !== null) {
      var rA = Math.min(W * 0.20, H * 0.52), rB = Math.min(W * 0.125, H * 0.33);
      sctx.strokeStyle = cv("--accent"); sctx.lineWidth = Math.max(1.4, dpr);
      sctx.beginPath(); sctx.arc(ax, ay, rA, -beta, 0); sctx.stroke();
      if (theta > 1.5 * RAD) { sctx.beginPath(); sctx.arc(ax, ay, rB, -theta, 0); sctx.stroke(); }
      var mb = beta * 0.62, mt = theta * 0.5;
      label(sctx, "\u03b2 " + (beta * DEG).toFixed(1) + "\u00b0",
            ax + (rA + 12 * dpr) * Math.cos(mb), ay - (rA + 12 * dpr) * Math.sin(mb),
            cv("--shock"), 14 * dpr);
      if (theta > 1.5 * RAD)
        label(sctx, "\u03b8 " + (theta * DEG).toFixed(1) + "\u00b0",
              ax + (rB + 14 * dpr) * Math.cos(mt), ay - (rB + 14 * dpr) * Math.sin(mt) + 10 * dpr,
              cv("--on-wedge"), 14 * dpr);
    }

    // 4. upstream streamlines
    sctx.strokeStyle = cv("--ink-faint"); sctx.lineWidth = Math.max(1, dpr);
    for (var j = 1; j <= 5; j++) {
      var y0 = ay - H * 0.115 * j;
      if (y0 < H * 0.06) break;
      sctx.beginPath(); sctx.moveTo(0, y0); sctx.lineTo(ax * 0.82, y0); sctx.stroke();
    }
    label(sctx, "M\u2081 = " + M.toFixed(2), W * 0.03, ay - H * 0.62, cv("--ink-soft"), 14 * dpr);
    if (detachedLabel)
      label(sctx, "detached bow shock", W * 0.03, ay - H * 0.50, cv("--shock"), 13 * dpr, "left");
  }

  /* ---------------- theta-beta-M chart ---------------- */
  function drawChart(M, theta, beta, d) {
    var W = chart.width, H = chart.height, dpr = W / chart.clientWidth;
    cctx.clearRect(0, 0, W, H);
    cctx.fillStyle = cv("--panel"); cctx.fillRect(0, 0, W, H);

    var m = { l: 52 * dpr, r: 16 * dpr, t: 16 * dpr, b: 34 * dpr };
    var pw = W - m.l - m.r, ph = H - m.t - m.b;
    var TMAX = 50, BMAX = 90;
    var X = function (t) { return m.l + t / TMAX * pw; };
    var Y = function (b) { return m.t + ph - b / BMAX * ph; };

    cctx.strokeStyle = cv("--grid"); cctx.lineWidth = Math.max(1, dpr * 0.8);
    for (var t = 0; t <= TMAX; t += 10) { cctx.beginPath(); cctx.moveTo(X(t), m.t); cctx.lineTo(X(t), m.t + ph); cctx.stroke(); }
    for (var b = 0; b <= BMAX; b += 15) { cctx.beginPath(); cctx.moveTo(m.l, Y(b)); cctx.lineTo(m.l + pw, Y(b)); cctx.stroke(); }

    cctx.fillStyle = cv("--ink-faint");
    cctx.font = "500 " + 11 * dpr + "px IBM Plex Mono, monospace";
    cctx.textAlign = "center"; cctx.textBaseline = "top";
    for (var t2 = 0; t2 <= TMAX; t2 += 10) cctx.fillText(String(t2), X(t2), m.t + ph + 7 * dpr);
    cctx.textAlign = "right"; cctx.textBaseline = "middle";
    for (var b2 = 0; b2 <= BMAX; b2 += 15) cctx.fillText(String(b2), m.l - 7 * dpr, Y(b2));
    cctx.textAlign = "center";
    cctx.fillText("\u03b8  (deg)", m.l + pw / 2, m.t + ph + 20 * dpr);

    if (M > 1) {
      var mu = Math.asin(1 / M) * DEG;
      // full curve, both branches
      cctx.strokeStyle = cv("--curve"); cctx.lineWidth = Math.max(1.8, dpr * 1.4);
      cctx.beginPath();
      for (var i = 0; i <= 400; i++) {
        var bb = mu + (90 - mu) * i / 400;
        var tt = thetaOf(bb * RAD, M) * DEG;
        if (i === 0) cctx.moveTo(X(tt), Y(bb)); else cctx.lineTo(X(tt), Y(bb));
      }
      cctx.stroke();

      // detachment marker
      cctx.strokeStyle = cv("--curve-2"); cctx.lineWidth = Math.max(1, dpr);
      cctx.setLineDash([5 * dpr, 4 * dpr]);
      cctx.beginPath();
      cctx.moveTo(X(d.thetaMax * DEG), m.t); cctx.lineTo(X(d.thetaMax * DEG), m.t + ph);
      cctx.stroke(); cctx.setLineDash([]);
      label(cctx, "\u03b8max " + (d.thetaMax * DEG).toFixed(1) + "\u00b0",
            X(d.thetaMax * DEG) + 6 * dpr, m.t + 12 * dpr, cv("--curve-2"), 11 * dpr);

      if (beta !== null) {
        var px = X(theta * DEG), py = Y(beta * DEG);
        cctx.fillStyle = cv("--shock");
        cctx.beginPath(); cctx.arc(px, py, Math.max(4.5, dpr * 4), 0, Math.PI * 2); cctx.fill();
        cctx.strokeStyle = cv("--shock"); cctx.lineWidth = Math.max(1, dpr);
        cctx.setLineDash([3 * dpr, 3 * dpr]);
        cctx.beginPath(); cctx.moveTo(px, py); cctx.lineTo(m.l, py); cctx.stroke();
        cctx.beginPath(); cctx.moveTo(px, py); cctx.lineTo(px, m.t + ph); cctx.stroke();
        cctx.setLineDash([]);
      }
    } else {
      label(cctx, "subsonic \u2014 no oblique shock solution", m.l + pw / 2, m.t + ph / 2, cv("--ink-faint"), 13 * dpr, "center");
    }
  }

  /* ---------------- wiring ---------------- */
  function rows(pairs) {
    document.getElementById("ro").innerHTML = pairs
      .map(function (p) { return "<dt>" + p[0] + "</dt><dd>" + p[1] + "</dd>"; }).join("");
  }

  function render() {
    var M = parseFloat(el.M.value);
    var theta = parseFloat(el.T.value) * RAD;
    document.getElementById("vM").textContent = M.toFixed(2);
    document.getElementById("vT").textContent = (theta * DEG).toFixed(1) + "\u00b0";

    var warn = document.getElementById("warn");
    warn.hidden = true;

    if (!wedgeMode) {
      drawSource(M);
      document.getElementById("chartBox").style.display = "none";
      document.getElementById("cap").textContent =
        M > 1 ? "Wavefronts emitted at equal intervals; the source has outrun them."
              : "Wavefronts still enclose the source \u2014 no cone below M = 1.";
      rows(M > 1
        ? [["Mach angle \u03bc", (Math.asin(1 / M) * DEG).toFixed(2) + "\u00b0"],
           ["cone half-width", (Math.asin(1 / M) * DEG).toFixed(2) + "\u00b0"],
           ["1/M", (1 / M).toFixed(4)]]
        : [["Mach angle \u03bc", "\u2014"], ["regime", M < 1 ? "subsonic" : "sonic"], ["1/M", (1 / M).toFixed(4)]]);
      if (M <= 1) { warn.hidden = false; warn.textContent = "Below M = 1 the source never overtakes its own sound, so no Mach cone forms."; }
      return;
    }

    document.getElementById("chartBox").style.display = "";
    if (M <= 1) {
      drawWedge(M, theta, null, true);
      drawChart(M, theta, null, { thetaMax: 0 });
      rows([["regime", "subsonic"]]);
      warn.hidden = false;
      warn.textContent = "Oblique shocks require M\u2081 > 1. Raise the Mach number.";
      return;
    }

    var d = detach(M);
    var beta = solveBeta(theta, M, el.strong.checked);
    drawWedge(M, theta, beta, beta === null);
    drawChart(M, theta, beta, d);

    if (beta === null) {
      rows([["\u03b8max", (d.thetaMax * DEG).toFixed(2) + "\u00b0"],
            ["\u03b2 at \u03b8max", (d.betaMax * DEG).toFixed(2) + "\u00b0"],
            ["status", "detached"]]);
      warn.hidden = false;
      warn.textContent = "\u03b8 = " + (theta * DEG).toFixed(1) + "\u00b0 exceeds \u03b8max = " +
        (d.thetaMax * DEG).toFixed(1) + "\u00b0 for M\u2081 = " + M.toFixed(2) +
        ", so no attached solution exists and the shock stands off as a curved bow shock.";
      document.getElementById("cap").textContent = "Detached \u2014 the wedge turns the flow more than this Mach number allows.";
      return;
    }

    var s = shockProps(M, beta, theta);
    rows([
      ["\u03b2", (beta * DEG).toFixed(2) + "\u00b0"],
      ["\u03bc", (Math.asin(1 / M) * DEG).toFixed(2) + "\u00b0"],
      ["\u03b8max", (d.thetaMax * DEG).toFixed(2) + "\u00b0"],
      ["M\u2099\u2081", s.Mn1.toFixed(3)],
      ["M\u2082", s.M2.toFixed(3)],
      ["p\u2082/p\u2081", s.p.toFixed(3)],
      ["\u03c1\u2082/\u03c1\u2081", s.rho.toFixed(3)],
      ["T\u2082/T\u2081", s.T.toFixed(3)],
      ["p\u2080\u2082/p\u2080\u2081", s.p0.toFixed(4)]
    ]);
    document.getElementById("cap").textContent =
      (el.strong.checked ? "Strong" : "Weak") + " solution \u2014 downstream flow is " +
      (s.M2 > 1 ? "supersonic" : "subsonic") + " at M\u2082 = " + s.M2.toFixed(2) + ".";
  }

  function setMode(w) {
    wedgeMode = w;
    document.getElementById("mSrc").setAttribute("aria-pressed", String(!w));
    document.getElementById("mWed").setAttribute("aria-pressed", String(w));
    document.getElementById("pT").classList.toggle("off", !w);
    document.getElementById("gSol").style.display = w ? "" : "none";
    document.getElementById("eqA").hidden = w;
    document.getElementById("eqB").hidden = !w;
    document.getElementById("note").innerHTML = w
      ? "<strong>Oblique shock.</strong> For every deflection below <code>\u03b8max</code> the relation admits " +
        "<em>two</em> shock angles. Nature picks the weak one unless downstream conditions force otherwise; the " +
        "strong branch leaves the flow subsonic. As <code>\u03b8 \u2192 0</code> the weak root collapses onto the " +
        "Mach angle \u2014 an infinitely weak shock <em>is</em> a Mach wave."
      : "<strong>Mach cone.</strong> Each circle is a wavefront emitted at an earlier instant, expanding at the " +
        "speed of sound while the source moves at <code>M</code> times that. Above <code>M = 1</code> the source " +
        "outruns them and the circles share a common tangent \u2014 the cone, with half-angle " +
        "<code>\u03bc = arcsin(1/M)</code>.";
    render();
  }

  document.getElementById("mSrc").addEventListener("click", function () { setMode(false); });
  document.getElementById("mWed").addEventListener("click", function () { setMode(true); });
  Object.keys(el).forEach(function (k) { el[k].addEventListener("input", render); });

  var lastW = -1;
  function resize() {
    var w = Math.max(280, scene.parentElement.clientWidth);
    if (w === lastW) return;
    lastW = w;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    scene.style.height = Math.round(w * 0.62) + "px";
    scene.width = Math.round(w * dpr); scene.height = Math.round(w * 0.62 * dpr);
    chart.style.height = Math.round(w * 0.37) + "px";
    chart.width = Math.round(w * dpr); chart.height = Math.round(w * 0.37 * dpr);
    render();
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(scene.parentElement);
  else window.addEventListener("resize", resize);
  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    if (mq.addEventListener) mq.addEventListener("change", render);
  }

  setMode(false);
  resize();

  window.__verify = function () {
    var out = [];
    out.push("mu(M=2) = " + (Math.asin(1 / 2) * DEG).toFixed(3) + "  [30.000]");
    out.push("beta_weak(M=2,th=10) = " + (solveBeta(10 * RAD, 2, false) * DEG).toFixed(3) + "  [39.314]");
    out.push("beta_strong(M=2,th=10) = " + (solveBeta(10 * RAD, 2, true) * DEG).toFixed(3) + "  [83.700]");
    var d2 = detach(2);
    out.push("theta_max(M=2) = " + (d2.thetaMax * DEG).toFixed(3) + "  [22.973]  at beta " + (d2.betaMax * DEG).toFixed(2) + "  [64.78]");
    var d3 = detach(3);
    out.push("theta_max(M=3) = " + (d3.thetaMax * DEG).toFixed(3) + "  [34.073]");
    var p = shockProps(2, solveBeta(10 * RAD, 2, false), 10 * RAD);
    out.push("M=2,th=10 weak: Mn1=" + p.Mn1.toFixed(4) + " [1.2671]  M2=" + p.M2.toFixed(4) +
             " [1.6405]  p2/p1=" + p.p.toFixed(4) + " [1.7066]");
    return out.join("\n");
  };
})();
</script>
</body>
</html>
